name: Publish model library
on:
  push:
    branches: [main]
    paths: ['library/**', '.github/workflows/library-pages.yml']
  pull_request:
    paths: ['library/**', '.github/workflows/library-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test library/catalog.test.mjs
      - run: node library/validate-catalog.mjs
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: library/public
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
